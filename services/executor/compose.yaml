services:
  executor:
    container_name: executor
    image: ${EXECUTOR_IMAGE:-ghcr.io/rhyssullivan/executor-selfhost:latest}
    ports:
      - "${EXECUTOR_HTTP_PORT:-4788}:4788"
    env_file:
      - ../../.env
    environment:
      EXECUTOR_WEB_BASE_URL: ${EXECUTOR_WEB_BASE_URL:-http://localhost:4788}
    volumes:
      - ../../data/executor/data:/data
    restart: unless-stopped
    networks:
      - ai-gateway-connect
    extra_hosts:
      - "host.docker.internal:host-gateway"
